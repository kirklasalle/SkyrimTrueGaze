# R14 E4.2 — CI gate: configure (standalone preset) → build → ctest.
# Runs on every push/PR touching code or build config. Windows-only because the
# plugin targets MSVC and the standalone harness compiles the same sources.
#
# Audit 2026-10-15 (F-01 / F-07): CI now runs scripts/Invoke-CiGate.ps1 — the
# exact gate developers run locally — so CI also fails on warning C5102 (asserts
# compiled out), version drift across docs, and configurator default drift.
name: build-test

on:
    push:
        branches: [main, master]
        paths:
            - "src/**"
            - "tests/**"
            - "include/**"
            - "cmake/**"
            - "scripts/Invoke-CiGate.ps1"
            - "scripts/Test-ConfiguratorParity.ps1"
            - "docs/USER_GUIDE.md"
            - "docs/DEVELOPER_GUIDE.md"
            - "docs/CONSOLE_COMMANDS_CARD.md"
            - "skyrim/TrueGazeConfig.html"
            - "scripts/Get-TrueGazeVersion.ps1"
            - "CMakeLists.txt"
            - "CMakePresets.json"
            - "vcpkg.json"
            - "README.md"
            - "CHANGELOG.md"
            - "PRD.md"
            - "ROADMAP.md"
            - "TrueGazeConfig.html"
            - "skyrim/SKSE/Plugins/TrueGaze.ini"
            - ".github/workflows/build-test.yml"
    pull_request:
        paths:
            - "src/**"
            - "tests/**"
            - "include/**"
            - "cmake/**"
            - "scripts/Invoke-CiGate.ps1"
            - "scripts/Test-ConfiguratorParity.ps1"
            - "docs/USER_GUIDE.md"
            - "docs/DEVELOPER_GUIDE.md"
            - "docs/CONSOLE_COMMANDS_CARD.md"
            - "skyrim/TrueGazeConfig.html"
            - "scripts/Get-TrueGazeVersion.ps1"
            - "CMakeLists.txt"
            - "CMakePresets.json"
            - "vcpkg.json"
            - "README.md"
            - "CHANGELOG.md"
            - "PRD.md"
            - "ROADMAP.md"
            - "TrueGazeConfig.html"
            - "skyrim/SKSE/Plugins/TrueGaze.ini"
            - ".github/workflows/build-test.yml"

jobs:
    build-test:
        runs-on: windows-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Restore vcpkg packages
              uses: actions/cache@v4
              with:
                  path: |
                      vcpkg_installed
                      ~/.cache/vcpkg/archives
                  key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

            - name: Set up Node for configurator regression checks
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: CI gate (configure, build, ctest, charter, docs, parity)
              shell: pwsh
              run: ./scripts/Invoke-CiGate.ps1 -Preset standalone

    build-plugin:
        runs-on: windows-latest
        steps:
            - name: Checkout (with CommonLibSSE-NG submodule)
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Restore vcpkg packages
              uses: actions/cache@v4
              with:
                  path: |
                      vcpkg_installed
                      ~/.cache/vcpkg/archives
                  key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

            - name: Configure & build TrueGaze.dll (windows-release)
              shell: pwsh
              run: |
                  if (-not $env:VCPKG_ROOT) { $env:VCPKG_ROOT = "C:\vcpkg" }
                  cmake --preset windows-release
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  cmake --build --preset release --target TrueGaze
                  exit $LASTEXITCODE
