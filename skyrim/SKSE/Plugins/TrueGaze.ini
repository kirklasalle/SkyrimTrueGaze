; TrueGaze™ - Biological NPC Gaze & Kinematics Engine for Skyrim SE/AE/VR
; A First-Party Product of Kirk LaSalle's Human Communication Eye Protocol (HCEP)
; Configuration and Tuning File

[General]
; Master toggle for procedural biological gaze engine
bEnableTrueGaze=true

; Enable specialized creature/predator/dragon kinematics
bEnableCreatures=true

; Target engine version (Auto-detect: SE, AE, VR)
sEngineTarget=Auto


[Kinematics]
; Multiplier for peak ballistic saccade velocity (empirical human: 700-900 deg/s)
fSaccadeSpeedMult=1.000000

; Velocity saturation constant (c parameter in Main Sequence equation)
fVelocitySaturation=14.000000

; Amplitude of micro-saccadic Brownian drift preventing visual freezing (degrees)
fMicroJitterAmp=0.350000

; Frequency interval for micro-jitter updates (seconds)
fMicroJitterIntervalMin=0.200000
fMicroJitterIntervalMax=0.450000

; Vestibulo-Ocular Reflex (VOR) head damping tracking factor
fHeadTrackingSpeed=6.000000

; Maximum comfortable local eye angle before forced neck/head engagement (degrees)
fMaxComfortEyeAngle=35.000000


[SkeletalHierarchy]
; Strain distribution percentages across NetImmerse bone hierarchy
fSpine2YawWeight=0.100000
fNeckYawWeight=0.250000
fNeckPitchWeight=0.250000
fHeadYawWeight=0.650000
fHeadPitchWeight=0.750000


[Social]
; Enable Cognitive Gaze Aversion when NPCs process thoughts (THINK mode)
bEnableGazeAversion=true

; Enable Argyle & Cook Social Triangle gaze cycling (eye-to-eye-to-mouth) in dialogue
bEnableSocialTriangle=true

; Base social triangle fixation duration (seconds)
fTriangleFixationDuration=0.350000

; Duration of continuous mutual eye contact required for intimacy/reactions (seconds)
fMutualGazeThreshold=2.000000

[Crosshair]
; Player crosshair gaze: when the crosshair rests on an NPC's face, that NPC
; looks back at the player's face (mutual gaze). The sweet spot is angular:
; the crosshair must be within the head's angular size plus the tolerance,
; so close NPCs are forgiving and distant ones require precision.
; Enable crosshair-driven mutual gaze
bEnableCrosshairGaze=true

; Base angular tolerance of the face sweet spot (degrees, added to the head's
; angular radius at the target's distance)
fCrosshairToleranceDeg=4.000000

; Beyond this range the crosshair no longer confers social attention (meters)
fCrosshairMaxRangeMeters=25.000000

; Below this range any crosshair contact counts as face contact (meters)
fCrosshairPointBlankMeters=1.500000


[Bridge]
; Enable connection to Kirk LaSalle's HCEP Desktop Suite via Windows Named Pipe.
;
; PRIVACY: enabling this receives biometric data from a camera (gaze vector, head
; pose, blink state, cognitive classification) and uses it to drive NPC animation.
; Nothing is written to disk and nothing leaves the machine, but you should only
; enable it when everyone in front of the camera has agreed to it. See the
; BIOMETRIC AND PERSONAL DATA NOTICE in LICENSE. Default: true.
bConnectHcepBridge=true

; Named Pipe IPC address
sPipeName=\\.\pipe\TrueGazeBridge

; Background worker reconnection interval (seconds)
fAutoReconnectIntervalSec=3.000000


[LOD]
; Distance threshold for Tier 1: Full biological oculomotor kinematics (meters)
fTier1DistanceMeters=5.000000

; Distance threshold for Tier 2: Head/Neck kinematics active, eyes simplified (meters)
fTier2DistanceMeters=15.000000


[Debug]
; Render in-game 3D line-of-sight visualizer rays
bDebugGazeRays=false

; Logging level: 0 = Trace, 1 = Debug, 2 = Info, 3 = Warn, 4 = Error
iLogLevel=2


[Visuals]
; In-game 3D representation of the solved gaze ("Superman laser eyes").
;
; This is a DEVELOPER diagnostic subsystem. It never touches the live engine, the
; save game, or actor state - it only attaches visual emitters to the skeleton and
; removes them when disabled. Everything here is off by default.
;
; Master switch for every in-game visual
bEnableInGameVisuals=false

; Emit a gaze beam from each actor's pupil along the solved gaze direction
bGazeRaysEnabled=false

; Render mode: 0 = Both (light + branded geometry), 1 = Light only (no art needed),
; 2 = Geometry only (suppress the light emitters)
iRayRenderMode=0

; Beam reach in meters (drives the light radius and the terminus position)
fGazeRayLengthMeters=10.000000

; Beam colour as decimal 0xRRGGBB. Default 13174890 = #C9A86A TrueGaze gold
iGazeRayColour=13174890

; Emitter brightness, 0..1
fGazeRayOpacity=0.850000

; Which actors emit beams
bGazeRaysOnPlayer=true
bGazeRaysOnNPCs=true
bGazeRaysOnCreatures=true

; Attach the emitter to the head bone (true) or the actor root (false)
bGazeRaysAttachHead=true

; Also place a second glow where the gaze lands (makes direction legible at range)
bGazeRaysTerminus=false

; Pupil origin, offset from the head bone origin. Vanilla humanoid rigs expose no
; eye bones (eyes are FaceGen morphs), so the socket is derived geometrically.
; Tune these if beams appear in front of or behind the face.
fPupilForwardOffsetCm=7.000000
fPupilUpOffsetCm=1.500000

; Pupil emitter brightness multiplier
fPupilGlowIntensity=0.500000


[Console]
; Runtime console commands for the game's own console (~).
;
; VANILLA BY DESIGN: this uses only the vanilla console. It adds no Papyrus, no
; ESP/ESL, no MCM and no SkyUI dependency. It is also a hard requirement rather
; than a preference - Papyrus native functions cannot be invoked from the console
; at all, so the commands must be genuine entries in the engine's command table.
;
; Commands: tg, tgvisuals, tgv, tgon, tgoff, tgmode, tgradius, tgverbose, tgstatus
;
; Registration works by RECLAIMING table entries the engine already treats as dead
; or empty, so it needs no count and cannot displace a working vanilla command.
; OFF by default: it writes into engine memory, and has not yet been confirmed in a
; running game. Turn it on, launch, and type 'tgstatus' to verify.
bEnableConsoleCommands=false
