; TrueGaze™ - Biological NPC Gaze & Kinematics Engine for Skyrim SE/AE/VR
; A First-Party Product of Kirk LaSalle's Human Communication Eye Protocol (HCEP)
; Configuration and Tuning File

[General]
; Master toggle for procedural biological gaze engine
bEnableTrueGaze=true

; Enable specialized creature/predator/dragon kinematics
bEnableCreatures=true

; Target engine version (Auto-detect: SE, AE, VR)
sEngineTarget=Auto


[Kinematics]
; Multiplier for peak ballistic saccade velocity (empirical human: 700-900 deg/s)
fSaccadeSpeedMult=1.500000

; Velocity saturation constant (c parameter in Main Sequence equation)
fVelocitySaturation=18.000000

; Amplitude of micro-saccadic Brownian drift preventing visual freezing (degrees)
fMicroJitterAmp=0.280000

; Frequency interval for micro-jitter updates (seconds)
fMicroJitterIntervalMin=0.200000
fMicroJitterIntervalMax=0.450000

; Vestibulo-Ocular Reflex (VOR) head damping tracking factor.
; LOWER = slower, more graceful head turns.
fHeadTrackingSpeed=5.200000

; Smooth ocular pursuit rate (1/s). Governs how fast the eyes GLIDE between
; fixation points during continuous tracking (social triangle scanning, moving
; targets). Higher = snappier, lower = more languid. 12 = graceful glide.
fEyePursuitSpeed=12.000000

; Maximum comfortable local eye angle before forced neck/head engagement (degrees)
fMaxComfortEyeAngle=35.000000

; Biological latency gap: onset delay before head turns, allowing eyes to lead (seconds).
; Human eyes move ~80-150ms before the head follows. Higher = more visible eye-lead.
; 0.13 sits at the upper end of the biological window so the eyes clearly ARRIVE
; at the new target before the head begins to follow — the "eyes lead" signature.
fHeadOnsetDelaySec=0.130000


[SkeletalHierarchy]
; Strain distribution percentages across NetImmerse bone hierarchy.
; These control how much of the gaze deflection each bone absorbs.
; LOWER head/neck values = more eye movement, less head turning (more natural).
; Eyes receive the RESIDUAL after the head chain, so reducing the head share
; directly increases eye involvement.
fSpine2YawWeight=0.035000
fNeckYawWeight=0.070000
fNeckPitchWeight=0.070000
fHeadYawWeight=0.245000
fHeadPitchWeight=0.245000

; Head engagement threshold (degrees). For gaze shifts BELOW this angle,
; ONLY the eyes move — the head stays perfectly still. This prevents the
; robotic micro-head-turns during social triangle cycling at close range.
; Human heads don't move for small 2-5 degree gaze shifts. (0 = disabled)
; 12° covers the entire close-range social triangle (eye↔eye↔mouth glances are
; only a few degrees apart at cart distance), so those are pure eye movement.
fHeadEngageThresholdDeg=12.000000


[GazeTarget]
; THE EYES ARE THE TARGET. The head bone sits at the base of the skull, a few
; centimetres below and behind the eyeballs. These offsets lift the aim point
; (and the observer's own line of sight) up onto the eyeline, so NPCs look
; DIRECTLY into the eyes instead of at the throat or forehead. Applied along the
; head bone's own axes, so they track seated/leaning/crouched poses correctly.
fEyeAnchorForwardCm=8.000000
fEyeAnchorUpCm=8.500000

; Eyes lead the head. On vanilla NPCs the eyeballs have no bones — they move via
; FaceGen "Look" morphs only. These two keys make that eye movement clearly
; visible so the eyes read as leading the head during conversation, where real
; gaze shifts are only a few degrees.
;   fEyeMorphGain        : visible gain (1.0 = raw solved angle; higher = stronger)
;   fEyeMorphFullScaleDeg: eye deflection that maps to a fully-driven Look morph
;                          (smaller = eyes reach full visible travel sooner)
fEyeMorphGain=1.700000
fEyeMorphFullScaleDeg=20.000000


[CharacterProfile]
; TEMPERAMENT-DRIVEN GAZE. TrueGaze reads Skyrim's own characterization (the
; Confidence, Aggression, and Assistance actor values, relationship ranks,
; guard/child/race flags, and combat state) and projects it onto the HCEP-02
; Enhanced Diagram — so a cowardly merchant, a foolhardy guard, a lover, and
; a wolf each LOOK like themselves.
;   Confidence:  cowardly NPCs avert more, hold eye contact less, dart quicker.
;   Relationship: lovers hold eyes longer and visit the Heart region; enemies lock.
;   Guards:      steady, unflinching attention.
;   Children:    quick, curious scanning.
;   Creatures:   no social triangle — fixation-dominant animal attention.
; OFF = every actor uses the neutral profile (exact pre-profile behaviour).
bEnableCharacterProfiles=1


[Social]
; Enable Cognitive Gaze Aversion (CGA) using the full HCEP-02 Enhanced Diagram.
; When NPCs process thoughts (THINK mode), their gaze breaks away to peripheral
; aversion regions (upper-left, upper-right, lower-left, lower-right) with brief
; face returns, modelling cognitive processing. ON by default.
bEnableGazeAversion=true

; Enable Argyle & Cook Social Triangle gaze cycling (eye-to-eye-to-mouth) in dialogue
bEnableSocialTriangle=true

; Base social triangle fixation duration (seconds)
fTriangleFixationDuration=0.350000

; Social triangle path randomness (0..1). 0 = classic fixed orbit
; (LeftEye -> RightEye -> Mouth, repeats), 1 = free organic wandering.
; At 0.6 the path still favours eye-to-eye transitions (as humans do) but
; lateral jumps, mouth-to-either-eye choices, and same-point re-fixations
; break every predictable loop, so the scanpath never looks machine-traced.
fTrianglePathRandomness=0.600000

; Duration of continuous mutual eye contact required for intimacy/reactions (seconds)
fMutualGazeThreshold=2.000000

; --- Cognitive Gaze Aversion (CGA) Timing ---
; CGA head involvement: fraction of normal head chain engagement during aversion.
; 0.0 = eyes-only aversion (most natural), 1.0 = full head chain (robotic).
; Recommended 0.05-0.15 for subtle head drift during eye aversion.
fCgaHeadInvolvement=0.080000

; Dialogue-Synced CGA Return: when enabled, CGA aversion ends and the NPC's
; gaze snaps back to the speaker's face at the precise moment dialogue begins.
; This creates the natural "oh, they said something" attention capture.
bDialogueSyncCgaReturn=true

; Offset CGA Return: adds a per-actor random offset of +/- this many seconds
; around dialogue onset, so not every NPC reacts identically. Some return
; slightly before (anticipatory), some after (delayed processing).
; 0.0 = all NPCs return at the exact same moment.
fCgaDialogueOffsetSec=2.000000

[Crosshair]
; Player crosshair gaze: when the crosshair rests on an NPC's face, that NPC
; looks back at the player's face (mutual gaze). The sweet spot is angular:
; the crosshair must be within the head's angular size plus the tolerance,
; so close NPCs are forgiving and distant ones require precision.
; Enable crosshair-driven mutual gaze
bEnableCrosshairGaze=true

; Base angular tolerance of the face sweet spot (degrees, added to the head's
; angular radius at the target's distance)
fCrosshairToleranceDeg=4.000000

; Beyond this range the crosshair no longer confers social attention (meters)
fCrosshairMaxRangeMeters=25.000000

; Below this range any crosshair contact counts as face contact (meters)
fCrosshairPointBlankMeters=1.500000


[Bridge]
; Enable connection to Kirk LaSalle's HCEP Desktop Suite via Windows Named Pipe.
;
; PRIVACY: enabling this receives biometric data from a camera (gaze vector, head
; pose, blink state, cognitive classification) and uses it to drive NPC animation.
; Nothing is written to disk and nothing leaves the machine, but you should only
; enable it when everyone in front of the camera has agreed to it. See the
; BIOMETRIC AND PERSONAL DATA NOTICE in LICENSE. Default: true.
bConnectHcepBridge=true

; Named Pipe IPC address
sPipeName=\\.\pipe\TrueGazeBridge

; Background worker reconnection interval (seconds)
fAutoReconnectIntervalSec=3.000000


[LOD]
; Distance threshold for Tier 1: Full biological oculomotor kinematics (meters)
fTier1DistanceMeters=5.000000

; Distance threshold for Tier 2: Head/Neck kinematics active, eyes simplified (meters)
fTier2DistanceMeters=15.000000


[Debug]
; Render in-game 3D line-of-sight visualizer rays (developer only)
bDebugGazeRays=false

; Logging level: 0 = Trace, 1 = Debug, 2 = Info, 3 = Warn, 4 = Error
iLogLevel=2


[Visuals]
; Diagnostic Visuals Policy:
; By default, bEnableInGameVisuals is FALSE so players experience pure, organic eye
; contact without developer diagnostic laser beams.
;
; When toggled via 'stgvisuals' or here, TrueGaze uses the verified vanilla editor
; marker arrow ('meshes\marker_arrow.nif') for beam geometry. The branded beam
; ('meshes\TrueGaze\GazeBeam.nif') remains the fallback, then NiPointLight emitters.
; NOTE: GazeBeam.nif was REWRITTEN SSE-correct on 2026-10-01 (16-byte positions,
; canonical VertexDesc, additive One/One alpha, authored at 70 units/1 m along +Y).
; The old hand-crafted version was retired in v1.0.6 (2026-09-27) after SEH crashes
; under multiple simultaneous beam actors (confirmed 2026-09-22 and 2026-09-23).
;
; Master switch for every in-game visual (default: false — developer preset only)
bEnableInGameVisuals=false

; Emit a gaze beam from each actor's pupil along the solved gaze direction
bGazeRaysEnabled=true

; Render mode: 0 = Both (light + beam geometry), 1 = Light only (safest),
; 2 = Geometry only (suppress the light emitters)
; Default 0: both light emitters and beam geometry are rendered so the laser is visible.
; Use stgmode in console to cycle modes.
iRayRenderMode=0

; Beam reach in meters (drives the light radius and the terminus position)
fGazeRayLengthMeters=2.500000

; Beam cross-section diameter in cm. The custom GazeBeam.nif is authored with a
; 5 mm radius baked in (NiTransform scale is uniform, so thickness cannot be set
; independently at runtime); this key is reserved for future per-vertex rebuilds.
fGazeRayThicknessCm=0.200000

; Beam colour as decimal 0xRRGGBB. Default 13174890 = #C9A86A TrueGaze gold
iGazeRayColour=13174890

; Emitter brightness, 0..1
fGazeRayOpacity=0.850000

; Which actors emit beams
bGazeRaysOnPlayer=true
bGazeRaysOnNPCs=true
bGazeRaysOnCreatures=true

; Attach the emitter to the head bone (true) or the actor root (false)
bGazeRaysAttachHead=true

; Also place a second glow where the gaze lands (makes direction legible at range)
bGazeRaysTerminus=true

; Pupil origin, offset from the head bone origin. Vanilla humanoid rigs expose no
; eye bones (eyes are FaceGen morphs), so the socket is derived geometrically.
; Tune these if beams appear in front of or behind the face.
fPupilForwardOffsetCm=12.000000
fPupilUpOffsetCm=6.000000

; Pupil emitter brightness multiplier (0.35 = subtle accent with geometry visible)
fPupilGlowIntensity=0.350000

; --- HCEP Floating Diagram Panel ---
; Displays the floating 3D gaze-region plane with chroma-keyed transparent background
; and dynamic active-region highlighting. The mesh is Bethesda's flat glow quad
; (fxglowflatrndmid, 512x512 units) retextured with the HCEP-02 diagram.
bShowHcepPanel=true
bHcepPanelAllActors=true
; Target panel HEIGHT in Skyrim units (the 512-unit quad is scaled to this;
; width follows the diagram's 1.835 aspect). 25 units = ~36 cm tall diagram.
fHcepPanelScale=25.000000
fHcepPanelForwardOffsetCm=70.000000


[Console]
; Runtime console commands for the game's own console (~).
;
; VANILLA BY DESIGN: this uses only the vanilla console. It adds no Papyrus, no
; ESP/ESL, no MCM and no SkyUI dependency. It is also a hard requirement rather
; than a preference - Papyrus native functions cannot be invoked from the console
; at all, so the commands must be genuine entries in the engine's command table.
;
; Commands: stg, stghelp (list all console commands), stgvisuals, stgv, stgpanel, stgon, stgoff,
;           stgmode, stgradius, stgverbose, stgstatus, stgpreset (cycle presets), stgreload (re-read INI),
;           stgtrace (structured JSONL trace toggle/status), stgtraceoff, stgtraceflush,
;           stgcal (step calibration deflection), stgcalsweep (11-region sweep), stgcaloff, stgcalaxes
;
; Registration works by RECLAIMING table entries the engine already treats as dead
; or empty, so it needs no count and cannot displace a working vanilla command.
bEnableConsoleCommands=true


[Debug]
; Structured JSONL Trace Logging (Phase R16 A8)
; High-throughput asynchronous trace logger writing to Data/SKSE/Plugins/TrueGaze_GazeTrace.jsonl
bEnableTraceLogging=false
iTraceBufferSize=256
iTraceMaxFileSizeMB=100
bTraceGazeTick=true
bTraceSaccades=true
bTraceRegionChanges=true
bTraceCGA=true
bTraceBlinks=false
bTraceHitMismatches=true
bEnableCalibrationCommands=true
bDebugGazeRays=false
iLogLevel=2


[Profiles]
; CATEGORY GAZE PROFILES (R15, 2026-09-27).
;
; Every entity CLASS in Skyrim now gazes like itself: Khajiit scan with feline
; darting, Argonians hold reptilian stillness, vampires lock unblinking, wolves
; stalk fixation-dominant, deer glance skittishly, draugr stare hollow, Dwarven
; constructs fixate mechanically. These per-category multipliers layer ON TOP of
; the temperament profile (Confidence/Aggression/relationship still matter — a
; cowardly Khajiit still averts more than a foolhardy one).
;
; OFF (bEnableCategoryProfiles=false) = temperament-only = exact pre-R15 behaviour.
; Absent keys keep the compiled defaults below. All multipliers clamp to [0.1..3]
; (path randomness [0..2]) — the same clamps the profile system applies.
bEnableCategoryProfiles=true

; --- Guards: steady, unflinching authority attention ---
fGuardAversionMult=0.600000
fGuardFixationMult=1.250000

; --- Children: quick, curious scanning; little sustained lock ---
fChildFixationMult=0.600000
fChildAversionMult=1.300000
fChildPathRandomnessMult=1.400000

; --- Vampires: intense, unblinking predatory lock ---
fVampireAversionMult=0.200000
fVampireFixationMult=1.500000

; --- Werewolves: feral, restless — brief hard locks, frequent shifts ---
fWerewolfFixationMult=0.700000
fWerewolfPathRandomnessMult=1.500000

; --- Khajiit: feline darting — quick curious glances, playful scanning ---
fKhajiitFixationMult=0.800000
fKhajiitPathRandomnessMult=1.300000

; --- Argonians: reptilian stillness — long steady holds, slow deliberate shifts ---
fArgonianFixationMult=1.300000
fArgonianAversionMult=0.700000

; --- Elves: Aldmeri poise — measured, composed, slightly aloof ---
fElfFixationMult=1.150000
fElfAversionMult=0.800000

; --- Orcs: direct, confrontational, little aversion ---
fOrcAversionMult=0.500000
fOrcFixationMult=1.200000

; --- Predators (wolves, sabre cats, bears): stalking attention, no triangle ---
fPredatorFixationMult=1.400000
fPredatorAversionMult=0.300000

; --- Prey animals (deer, elk): skittish wary glances ---
fPreyFixationMult=0.600000
fPreyAversionMult=1.600000

; --- Dragons: ancient, imperious, unblinking ---
fDragonFixationMult=1.800000
fDragonAversionMult=0.150000

; --- Undead (draugr, skeletons): hollow, unfocused vacant stares ---
fUndeadFixationMult=1.600000
fUndeadAversionMult=0.400000

; --- Daedra: otherworldly menace — hard lock, cold appraisal ---
fDaedraAversionMult=0.250000
fDaedraFixationMult=1.400000

; --- Dwarven constructs: mechanical fixation, zero social softness ---
fConstructFixationMult=2.000000
fConstructAversionMult=0.100000
